[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-ai-eval"
dynamic = ["version"]
description = "Reference harness for a candidate clinical-AI assurance protocol: perturbation-robustness screening for text-based clinical AI. Clinician-facing: missing-information and conflicting-evidence. Patient-facing: multi-turn triage under P1-P7 stress conditions. Not a validated standard; every test family is experimental."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Koyar Afrasyab, M.D.", email = "koyar@kinvectum.com" }]
classifiers = ["License :: OSI Approved :: Apache Software License"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Test deps are NOT runtime deps, but CI must install them or the suite that
# enforces every claim in this repo cannot run. A red branch on an evidence-
# integrity project is a release blocker.
dev = ["pytest>=8"]
# Real judges/subjects call HTTP APIs via stdlib urllib; no SDK is required.
# Install these only if you prefer the vendor SDKs elsewhere in your workflow.
llm = ["openai", "anthropic", "google-genai"]

[project.scripts]
# Runs from either a source checkout or an installed wheel. Wheel builds bundle
# runtime data under caeval/_data; CAEVAL_HOME remains an explicit override.
clinical-ai-eval = "caeval.cli:main"

[tool.setuptools.dynamic]
version = {attr = "caeval.version.__version__"}

[tool.setuptools.packages.find]
# find-based discovery so SUBPACKAGES (caeval.certificates) are included. The
# previous explicit list silently omitted them from a built wheel.
include = ["caeval*", "targets*"]

[tool.setuptools.package-data]
# Data files the runtime needs are mirrored from repo root into caeval/_data by
# setup.py's build_py hook. Package-data then ensures those mirrored files are
# retained in the wheel.
"caeval" = ["_data/**/*"]
