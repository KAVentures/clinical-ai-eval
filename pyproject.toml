[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-ai-eval"
version = "0.1.0"
description = "Reference harness for a candidate clinical-AI assurance protocol: perturbation-robustness screening (missing-information, conflicting-evidence) for text-based, CLINICIAN-facing decision support. Not a validated standard; patient-facing evaluation is not implemented."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Koyar Afrasyab, M.D.", email = "koyar@kinvectum.com" }]
classifiers = ["License :: OSI Approved :: Apache Software License"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Real judges/subjects call HTTP APIs via stdlib urllib; no SDK is required.
# Install these only if you prefer the vendor SDKs elsewhere in your workflow.
llm = ["openai", "anthropic", "google-genai"]

[project.scripts]
# Runs from the checkout (data files tests/ prompts/ configs/ are repo-relative;
# set CAEVAL_HOME if the package is installed away from its data).
clinical-ai-eval = "caeval.cli:main"

[tool.setuptools]
packages = ["caeval", "targets"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.toml", "*.txt"]
