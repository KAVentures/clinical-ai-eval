# configs/judge_panel.toml  (EVAL_STANDARD.md §7, §11)
#
# The judge panel is READ FROM CONFIG, never hardcoded (§11 "Known reconciliation
# needed before build"). The runtime enforces the configured distinct-provider quorum before any scoring runs.
# A single blinded judge is allowed when it is the prespecified calibrated evaluator
# for the endpoint/scope. Multi-provider panels remain available as an optional
# evaluator-robustness analysis; they are not assumed to eliminate bias.
#
# The two upstream repos hardcoded different panels:
#   evidence-sufficiency: openai / anthropic / xai / google (incl. Grok)
#   reconciliation:       gpt-5.5 / claude-opus-4-8 / gemini-3.1-pro
# Neither is baked in here. Swap `judges` for whatever panel a given run uses.
#
# `mock = true` selects the deterministic offline judge (no keys, no network) and
# forces the run's conformance ceiling to L0/NON_CONFORMANT for any CLAIM (§0),
# because a synthetic judge cannot support a conclusion. Real judges resolve via
# caeval/providers.py (keys loaded at runtime from a git-ignored file; never here).

min_distinct_providers = 1

# Deterministic offline panel used by the demo / smoke run. It intentionally keeps
# TWO mock judges so the software fixture continues to exercise disagreement logic,
# even though production assessments may use one calibrated judge.
#
# `mode` controls how much the judge is TOLD (see caeval/providers.py):
#   blinded      = sees only the case-as-shown + the answer (DEFAULT; headline rates).
#   rubric_aware = additionally sees the perturbation + expected missing evidence
#                  (a high-sensitivity defect detector, NOT a clinical-quality estimate).
# Including BOTH modes lets the report show the blinded-vs-cued gap, which is how
# much of the apparent detection came from cueing the evaluator.

[[judges]]
name = "mock_strict"
provider = "mock_a"
model = "det-strict-v1"
mode = "blinded"
mock = true

[[judges]]
name = "mock_lenient"
provider = "mock_b"
model = "det-lenient-v1"
mode = "blinded"
mock = true

# Same two evaluators, rubric-aware. Reported separately; never mixed into the
# blinded headline (they are the same underlying judges, not independent votes).
[[judges]]
name = "mock_strict_cued"
provider = "mock_a"
model = "det-strict-v1"
mode = "rubric_aware"
mock = true

[[judges]]
name = "mock_lenient_cued"
provider = "mock_b"
model = "det-lenient-v1"
mode = "rubric_aware"
mock = true

# ---------------------------------------------------------------------------
# Real judges (commented out). Any provider and any model; see
# docs/CHOOSING_MODELS.md. Put keys in environment variables (or the git-ignored
# API_KEYS.local.md). Check the panel offline with
#   clinical-ai-eval models check --panel configs/judge_panel.toml
# and confirm the IDs your key can use (no tokens generated) with
#   clinical-ai-eval models list --panel configs/judge_panel.toml
#
# A single blinded judge is permitted. For a multi-judge panel raise
# min_distinct_providers; it counts model DEVELOPERS (`vendor`), so two models
# reached through one aggregator do not count twice.
# `reasoning_effort` is the provider's own level; set it explicitly because
# providers change defaults between model versions.
# ---------------------------------------------------------------------------
# [[judges]]
# name = "opus-5.5"
# provider = "anthropic"
# model = "claude-opus-5-5"
# reasoning_effort = "high"
# mock = false
#
# [[judges]]
# name = "gpt"
# provider = "openai"
# model = "<model id from `models list`>"
# reasoning_effort = "high"
# mock = false
#
# Any OpenAI-compatible endpoint (another vendor, an aggregator, a gateway, or a
# local open-weight server such as vLLM or Ollama) is defined as a provider:
#
# [providers.local_vllm]
# api = "openai_chat_completions"
# base_url = "http://localhost:8000/v1"
# api_key_env = ""          # empty: no key needed
# effort_param = ""         # empty: the server takes no reasoning_effort field
# vendor = "open_weight"
#
# [[judges]]
# name = "open-weight-judge"
# provider = "local_vllm"
# model = "org/model-name"
# reasoning_effort = "provider_default"
# mock = false
