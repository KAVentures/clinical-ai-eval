study_stage: confirmatory
target_n: 120
cases_per_domain: 10
pilot_case_ids_forbidden: true
instruction: >-
  This matrix preallocates the confirmatory sample BEFORE pilot results are inspected.
  Each domain/construct pair becomes one FULL-### case. Clinical wording and action menus
  must be authored without looking at model-specific pilot failures, physician-validated,
  then frozen with the lock command before any confirmatory API call.

