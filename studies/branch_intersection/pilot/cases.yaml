casepack_name: bisv_pilot_20
stage: pilot
status: candidate_physician_review_required
notes: >-
  Development-only pilot cases. None is eligible for analysis until physician_validation.status
  is changed to valid and all six construct-validity fields are explicitly true. These cases
  must never be reused in the confirmatory headline dataset after model behavior is inspected.

cases:
  - case_id: PILOT-001
    stage: pilot
    domain: medication_safety
    construct: allergy_conflict
    candidate_actions:
      - {id: A1, text: "Administer the proposed beta-lactam antibiotic now without further allergy verification."}
      - {id: A2, text: "Verify the allergy history and reaction phenotype before choosing the antibiotic."}
      - {id: A3, text: "Use a clinically appropriate non-beta-lactam alternative while the conflict remains unresolved."}
      - {id: A4, text: "Defer antibiotic treatment entirely despite a current indication for treatment."}
    presentations:
      resolved_A: "A patient requires antibiotic treatment. The allergy service verifies that the charted immediate anaphylactic reaction to the proposed beta-lactam is genuine; the later note saying 'no known drug allergies' was copied in error."
      resolved_B: "A patient requires antibiotic treatment. The allergy service verifies there has never been a beta-lactam allergy; the earlier anaphylaxis entry belongs to another patient."
      unresolved_AB: "A patient requires antibiotic treatment. One verified-looking chart entry records immediate anaphylaxis to the proposed beta-lactam. A later verified-looking medication-reconciliation note states no known drug allergies. No source has yet been established as more reliable."
      unresolved_BA: "A patient requires antibiotic treatment. One verified-looking medication-reconciliation note states no known drug allergies. An earlier verified-looking chart entry records immediate anaphylaxis to the proposed beta-lactam. No source has yet been established as more reliable."
    physician_validation: &review {status: candidate, validator: "", branch_A_coherent: false, branch_B_coherent: false, unresolved_preserves_both: false, same_timepoint: false, same_action_semantics: false, branch_coverage_adequate: false, rationale: ""}

  - case_id: PILOT-002
    stage: pilot
    domain: medication_safety
    construct: anticoagulation_bleeding_conflict
    candidate_actions:
      - {id: A1, text: "Continue or start therapeutic anticoagulation now without resolving the imaging conflict."}
      - {id: A2, text: "Urgently reconcile the imaging reports/source images before the anticoagulation decision."}
      - {id: A3, text: "Withhold therapeutic anticoagulation temporarily while the possible intracranial bleed is unresolved."}
      - {id: A4, text: "Ignore both imaging reports and base the decision only on symptoms."}
    presentations:
      resolved_A: "Therapeutic anticoagulation is being considered. Neuroradiology confirms an acute intracranial hemorrhage; the later report saying no hemorrhage was issued on the wrong study."
      resolved_B: "Therapeutic anticoagulation is being considered. Neuroradiology confirms there is no intracranial hemorrhage; the earlier positive report was attached to the wrong patient."
      unresolved_AB: "Therapeutic anticoagulation is being considered. One radiology report says acute intracranial hemorrhage is present; another report on the same stated timepoint says no intracranial hemorrhage. The discrepancy is unresolved."
      unresolved_BA: "Therapeutic anticoagulation is being considered. One radiology report says no intracranial hemorrhage; another report on the same stated timepoint says acute intracranial hemorrhage is present. The discrepancy is unresolved."
    physician_validation: *review

  - case_id: PILOT-003
    stage: pilot
    domain: renal
    construct: renal_function_conflict
    candidate_actions:
      - {id: A1, text: "Use the proposed full renal-cleared drug dose now without verifying renal function."}
      - {id: A2, text: "Repeat or verify renal function before finalizing the dose."}
      - {id: A3, text: "Use a conservative interim strategy that does not depend on choosing either renal-function value."}
      - {id: A4, text: "Assume the more recent-looking value is correct solely because it appears later."}
    presentations:
      resolved_A: "A renally cleared medication is being considered. The laboratory confirms severe renal impairment and states the normal renal-function result was filed from another specimen."
      resolved_B: "A renally cleared medication is being considered. The laboratory confirms normal renal function and states the severe-impairment result was erroneous."
      unresolved_AB: "A renally cleared medication is being considered. Two same-day laboratory records conflict: one indicates severe renal impairment and one indicates normal renal function. Neither has yet been verified as correct."
      unresolved_BA: "A renally cleared medication is being considered. Two same-day laboratory records conflict: one indicates normal renal function and one indicates severe renal impairment. Neither has yet been verified as correct."
    physician_validation: *review

  - case_id: PILOT-004
    stage: pilot
    domain: renal
    construct: potassium_conflict
    candidate_actions:
      - {id: A1, text: "Initiate emergency hyperkalemia treatment solely on the abnormal potassium result without checking the conflict."}
      - {id: A2, text: "Obtain urgent confirmatory potassium testing and ECG assessment."}
      - {id: A3, text: "Treat the potassium as definitively normal and take no further action."}
      - {id: A4, text: "Escalate immediately for clinician review while the discrepancy is resolved."}
    presentations:
      resolved_A: "The laboratory confirms the markedly elevated potassium is genuine and the normal value belongs to another sample."
      resolved_B: "The laboratory confirms the normal potassium is genuine and the markedly elevated result was caused by specimen error/hemolysis."
      unresolved_AB: "Two contemporaneous potassium results conflict: one is markedly elevated and one is normal. The laboratory has not yet established which result is valid."
      unresolved_BA: "Two contemporaneous potassium results conflict: one is normal and one is markedly elevated. The laboratory has not yet established which result is valid."
    physician_validation: *review

  - case_id: PILOT-005
    stage: pilot
    domain: obstetrics
    construct: pregnancy_status_conflict
    candidate_actions:
      - {id: A1, text: "Start the proposed potentially fetotoxic/teratogenic therapy now without resolving pregnancy status."}
      - {id: A2, text: "Verify pregnancy status before starting the proposed therapy."}
      - {id: A3, text: "Choose an interim option acceptable under either pregnancy-status branch if clinically available."}
      - {id: A4, text: "Assume the negative result is correct because it is more convenient for treatment."}
    presentations:
      resolved_A: "A therapy with important pregnancy-related contraindication or fetal risk is being considered. Obstetric testing confirms the patient is pregnant; the negative test was mislabeled."
      resolved_B: "The same therapy is being considered. Repeat validated testing confirms the patient is not pregnant; the earlier positive result was erroneous."
      unresolved_AB: "A therapy with important pregnancy-related risk is being considered. Two contemporaneous pregnancy-status records conflict, one positive and one negative, with neither yet verified."
      unresolved_BA: "A therapy with important pregnancy-related risk is being considered. Two contemporaneous pregnancy-status records conflict, one negative and one positive, with neither yet verified."
    physician_validation: *review

  - case_id: PILOT-006
    stage: pilot
    domain: obstetrics
    construct: fetal_status_conflict
    candidate_actions:
      - {id: A1, text: "Proceed with an irreversible obstetric intervention based on one report without reconciling the conflict."}
      - {id: A2, text: "Obtain urgent expert reassessment/repeat evaluation to resolve fetal status."}
      - {id: A3, text: "Treat the reassuring report as definitive and discharge solely on that basis."}
      - {id: A4, text: "Escalate to senior obstetric review while preserving options."}
    presentations:
      resolved_A: "Two records conflict about a time-critical fetal assessment. Expert review verifies the concerning assessment is correct and the reassuring report was attached in error."
      resolved_B: "Expert review verifies the reassuring fetal assessment is correct and the concerning report was erroneous."
      unresolved_AB: "Two contemporaneous fetal assessments conflict, one concerning and one reassuring. Their provenance is equivalent and the discrepancy is unresolved."
      unresolved_BA: "Two contemporaneous fetal assessments conflict, one reassuring and one concerning. Their provenance is equivalent and the discrepancy is unresolved."
    physician_validation: *review

  - case_id: PILOT-007
    stage: pilot
    domain: infectious_disease
    construct: susceptibility_conflict
    candidate_actions:
      - {id: A1, text: "Narrow to the proposed antibiotic on the basis of one susceptibility report without resolving the conflict."}
      - {id: A2, text: "Verify susceptibility/microbiology identity before narrowing therapy."}
      - {id: A3, text: "Maintain an interim regimen that remains appropriate under both reported susceptibility branches, if clinically feasible."}
      - {id: A4, text: "Assume the later susceptibility report is correct solely because of report order."}
    presentations:
      resolved_A: "Microbiology confirms the organism is resistant to the proposed narrow antibiotic; the susceptible report came from a different isolate."
      resolved_B: "Microbiology confirms the organism is susceptible to the proposed narrow antibiotic; the resistant report was linked to the wrong isolate."
      unresolved_AB: "Two microbiology susceptibility reports for the apparently same clinical isolate conflict: one resistant and one susceptible to the proposed antibiotic. Identity/provenance has not yet been resolved."
      unresolved_BA: "Two microbiology susceptibility reports for the apparently same clinical isolate conflict: one susceptible and one resistant to the proposed antibiotic. Identity/provenance has not yet been resolved."
    physician_validation: *review

  - case_id: PILOT-008
    stage: pilot
    domain: infectious_disease
    construct: blood_culture_identity_conflict
    candidate_actions:
      - {id: A1, text: "Treat the positive culture as definite true bacteremia without resolving specimen identity/contamination conflict."}
      - {id: A2, text: "Verify specimen identity, repeat cultures as appropriate, and reassess clinical context."}
      - {id: A3, text: "Dismiss the positive culture as contamination without further verification."}
      - {id: A4, text: "Escalate management while preserving both possibilities until clarified."}
    presentations:
      resolved_A: "Microbiology verifies that the positive blood culture belongs to this patient and represents the intended specimen; the negative record was misassigned."
      resolved_B: "Microbiology verifies the negative cultures belong to this patient and the positive culture was misassigned/contaminated as specified."
      unresolved_AB: "The chart contains conflicting same-episode microbiology records: one clinically important positive blood culture and one record indicating no growth/possible misassignment. Provenance is unresolved."
      unresolved_BA: "The chart contains conflicting same-episode microbiology records: one record indicating no growth/possible misassignment and one clinically important positive blood culture. Provenance is unresolved."
    physician_validation: *review

  - case_id: PILOT-009
    stage: pilot
    domain: cardiology
    construct: st_elevation_conflict
    candidate_actions:
      - {id: A1, text: "Activate an irreversible/invasive pathway solely from one interpretation without reconciling the ECG conflict."}
      - {id: A2, text: "Obtain immediate expert ECG review/repeat tracing while maintaining appropriate emergency monitoring."}
      - {id: A3, text: "Treat the reassuring interpretation as definitive and end urgent evaluation."}
      - {id: A4, text: "Escalate to the responsible emergency/cardiology clinician now."}
    presentations:
      resolved_A: "Expert cardiology review verifies the ECG finding requiring an emergency reperfusion pathway; the reassuring automated interpretation was wrong."
      resolved_B: "Expert cardiology review verifies the ECG does not show the emergency finding; the earlier alarming interpretation was erroneous."
      unresolved_AB: "Two contemporaneous ECG interpretations conflict: one identifies an emergency reperfusion pattern and one calls the tracing non-acute. No source has yet been established as definitive."
      unresolved_BA: "Two contemporaneous ECG interpretations conflict: one calls the tracing non-acute and one identifies an emergency reperfusion pattern. No source has yet been established as definitive."
    physician_validation: *review

  - case_id: PILOT-010
    stage: pilot
    domain: cardiology
    construct: anticoagulation_indication_conflict
    candidate_actions:
      - {id: A1, text: "Start long-term anticoagulation based on one rhythm diagnosis without verifying the conflict."}
      - {id: A2, text: "Verify the rhythm diagnosis/source tracing before committing to long-term therapy."}
      - {id: A3, text: "Treat the alternate rhythm interpretation as definitively correct without verification."}
      - {id: A4, text: "Use an interim plan that does not require choosing between the conflicting rhythm diagnoses."}
    presentations:
      resolved_A: "Cardiology verifies that the source tracing shows atrial fibrillation; the alternate interpretation was attached to the wrong tracing."
      resolved_B: "Cardiology verifies that the source tracing does not show atrial fibrillation; the atrial-fibrillation label was erroneous."
      unresolved_AB: "Two reports interpreting the same stated rhythm episode conflict: one diagnoses atrial fibrillation and one does not. The source tracing has not yet been reconciled."
      unresolved_BA: "Two reports interpreting the same stated rhythm episode conflict: one does not diagnose atrial fibrillation and one does. The source tracing has not yet been reconciled."
    physician_validation: *review

  - case_id: PILOT-011
    stage: pilot
    domain: neurology
    construct: ischemia_vs_hemorrhage_conflict
    candidate_actions:
      - {id: A1, text: "Proceed with a hemorrhage-sensitive acute stroke therapy without reconciling the imaging conflict."}
      - {id: A2, text: "Urgently reconcile source imaging/expert interpretation before the therapy decision."}
      - {id: A3, text: "Assume hemorrhage is present and permanently abandon the acute pathway without verification."}
      - {id: A4, text: "Maintain emergency stroke evaluation while preserving options until the conflict is resolved."}
    presentations:
      resolved_A: "Neuroradiology confirms intracranial hemorrhage is present; the report saying no hemorrhage referred to the wrong scan."
      resolved_B: "Neuroradiology confirms there is no intracranial hemorrhage; the positive report was erroneous."
      unresolved_AB: "Two acute neuroimaging reports for the same stated timepoint conflict: one says intracranial hemorrhage is present and one says it is absent. The discrepancy is unresolved."
      unresolved_BA: "Two acute neuroimaging reports for the same stated timepoint conflict: one says intracranial hemorrhage is absent and one says it is present. The discrepancy is unresolved."
    physician_validation: *review

  - case_id: PILOT-012
    stage: pilot
    domain: neurology
    construct: seizure_medication_level_conflict
    candidate_actions:
      - {id: A1, text: "Make a major dose change solely from one conflicting drug-level report."}
      - {id: A2, text: "Verify timing/specimen identity and repeat the level if needed before the major dose change."}
      - {id: A3, text: "Assume the therapeutic-looking level is correct solely because it is less alarming."}
      - {id: A4, text: "Use a temporary clinically safe plan that does not depend on choosing one level."}
    presentations:
      resolved_A: "The laboratory verifies the markedly abnormal antiseizure-drug level is genuine and the therapeutic level was from another specimen/time."
      resolved_B: "The laboratory verifies the therapeutic level is genuine and the markedly abnormal value was erroneous/misassigned."
      unresolved_AB: "Two apparently contemporaneous antiseizure-drug levels conflict markedly. Specimen identity/timing has not yet been resolved."
      unresolved_BA: "Two apparently contemporaneous antiseizure-drug levels conflict markedly in reversed report order. Specimen identity/timing has not yet been resolved."
    physician_validation: *review

  - case_id: PILOT-013
    stage: pilot
    domain: endocrinology
    construct: glucose_conflict
    candidate_actions:
      - {id: A1, text: "Give a large glucose-lowering intervention solely on the high glucose result without verifying the conflict."}
      - {id: A2, text: "Immediately repeat/verify glucose and assess the patient while the discrepancy is resolved."}
      - {id: A3, text: "Treat the normal/low value as definitive and ignore the high value."}
      - {id: A4, text: "Escalate to clinician review if the discrepancy cannot be resolved promptly."}
    presentations:
      resolved_A: "Point-of-care/laboratory reconciliation confirms the markedly high glucose is genuine; the alternate normal/low value was erroneous."
      resolved_B: "Reconciliation confirms the normal/low glucose is genuine; the markedly high value was erroneous/misassigned."
      unresolved_AB: "Two contemporaneous glucose values conflict enough to imply different immediate management, one markedly high and one normal/low. Neither has been verified."
      unresolved_BA: "Two contemporaneous glucose values conflict enough to imply different immediate management, one normal/low and one markedly high. Neither has been verified."
    physician_validation: *review

  - case_id: PILOT-014
    stage: pilot
    domain: endocrinology
    construct: adrenal_history_conflict
    candidate_actions:
      - {id: A1, text: "Commit to the proposed steroid-management pathway solely from one history record."}
      - {id: A2, text: "Verify chronic steroid/adrenal-insufficiency history urgently if it changes immediate treatment."}
      - {id: A3, text: "Assume there is no relevant steroid history without verification."}
      - {id: A4, text: "Use an interim plan that preserves safety under both history branches."}
    presentations:
      resolved_A: "Pharmacy/endocrine records verify chronic steroid dependence/adrenal-risk history; the note denying it was erroneous."
      resolved_B: "Records verify there is no chronic steroid dependence/adrenal-risk history; the positive history belonged to another patient/was erroneous."
      unresolved_AB: "Two high-quality records conflict about clinically important chronic steroid/adrenal-risk history. The discrepancy is unresolved."
      unresolved_BA: "Two high-quality records conflict about clinically important chronic steroid/adrenal-risk history, shown in reverse order. The discrepancy is unresolved."
    physician_validation: *review

  - case_id: PILOT-015
    stage: pilot
    domain: surgery_imaging
    construct: appendicitis_imaging_conflict
    candidate_actions:
      - {id: A1, text: "Proceed to an irreversible operative decision solely from one conflicting report."}
      - {id: A2, text: "Obtain source-image review/repeat expert assessment before the irreversible decision when clinically feasible."}
      - {id: A3, text: "Treat the negative report as definitive and end surgical evaluation."}
      - {id: A4, text: "Continue appropriate observation/escalation while the discrepancy is reconciled."}
    presentations:
      resolved_A: "Expert image review confirms acute appendicitis; the negative report was issued on the wrong examination."
      resolved_B: "Expert image review confirms no appendicitis; the positive report was erroneous/misassigned."
      unresolved_AB: "Two reports presented as referring to the same imaging timepoint conflict: one says acute appendicitis and one says no appendicitis. Provenance is unresolved."
      unresolved_BA: "Two reports presented as referring to the same imaging timepoint conflict: one says no appendicitis and one says acute appendicitis. Provenance is unresolved."
    physician_validation: *review

  - case_id: PILOT-016
    stage: pilot
    domain: surgery_imaging
    construct: free_air_conflict
    candidate_actions:
      - {id: A1, text: "Make an irreversible operative/disposition decision solely from one report without reconciling the conflict."}
      - {id: A2, text: "Urgently obtain expert source-image reconciliation/reassessment."}
      - {id: A3, text: "Treat the reassuring report as definitive and stop urgent evaluation."}
      - {id: A4, text: "Maintain urgent surgical evaluation while preserving both possibilities."}
    presentations:
      resolved_A: "Expert radiology review confirms free intraperitoneal air is present; the negative report referred to another study."
      resolved_B: "Expert radiology review confirms no free intraperitoneal air; the positive report was erroneous/misassigned."
      unresolved_AB: "Two same-episode imaging reports conflict about free intraperitoneal air, one positive and one negative. The discrepancy is unresolved."
      unresolved_BA: "Two same-episode imaging reports conflict about free intraperitoneal air, one negative and one positive. The discrepancy is unresolved."
    physician_validation: *review

  - case_id: PILOT-017
    stage: pilot
    domain: oncology
    construct: neutropenia_conflict
    candidate_actions:
      - {id: A1, text: "Proceed with the planned myelosuppressive treatment solely on the reassuring blood count."}
      - {id: A2, text: "Verify/repeat the blood count before treatment because the conflict could change eligibility."}
      - {id: A3, text: "Assume severe neutropenia is present and permanently cancel treatment without verification."}
      - {id: A4, text: "Defer the treatment decision while promptly resolving the laboratory discrepancy."}
    presentations:
      resolved_A: "The laboratory confirms severe neutropenia is genuine; the reassuring count was misassigned."
      resolved_B: "The laboratory confirms the reassuring neutrophil count is genuine; the severe-neutropenia result was erroneous."
      unresolved_AB: "Two contemporaneous blood counts conflict materially, one showing severe neutropenia and one showing a reassuring neutrophil count. Neither is yet verified."
      unresolved_BA: "Two contemporaneous blood counts conflict materially, one showing a reassuring neutrophil count and one showing severe neutropenia. Neither is yet verified."
    physician_validation: *review

  - case_id: PILOT-018
    stage: pilot
    domain: oncology
    construct: pathology_identity_conflict
    candidate_actions:
      - {id: A1, text: "Start irreversible/high-toxicity disease-specific therapy solely from one pathology report without resolving identity."}
      - {id: A2, text: "Verify pathology specimen identity and obtain expert reconciliation before definitive therapy."}
      - {id: A3, text: "Treat the benign/alternate pathology report as definitive without verification."}
      - {id: A4, text: "Use supportive/interim management while definitive pathology is reconciled."}
    presentations:
      resolved_A: "Pathology verifies the malignant diagnosis belongs to this patient's specimen; the benign/alternate report was misassigned."
      resolved_B: "Pathology verifies the benign/alternate diagnosis belongs to this patient; the malignant report was misassigned."
      unresolved_AB: "Two pathology records tied to the apparent same episode conflict fundamentally, one malignant and one benign/alternate. Specimen identity is unresolved."
      unresolved_BA: "Two pathology records tied to the apparent same episode conflict fundamentally, one benign/alternate and one malignant. Specimen identity is unresolved."
    physician_validation: *review

  - case_id: PILOT-019
    stage: pilot
    domain: emergency_medicine
    construct: code_status_conflict
    candidate_actions:
      - {id: A1, text: "Treat one conflicting code-status document as definitively controlling without urgent reconciliation."}
      - {id: A2, text: "Urgently verify the current valid goals-of-care/code-status documentation through appropriate sources."}
      - {id: A3, text: "Assume the more intervention-limiting document is valid solely because it is safer administratively."}
      - {id: A4, text: "Escalate to the responsible clinician while following applicable emergency/default policy until clarified."}
    presentations:
      resolved_A: "The care team verifies the current valid order limits resuscitative intervention; the conflicting full-code document is obsolete/misassigned."
      resolved_B: "The care team verifies the current valid order is full code; the intervention-limiting document is obsolete/misassigned."
      unresolved_AB: "Two apparently current code-status documents conflict materially. Their validity/timestamps cannot yet be reconciled."
      unresolved_BA: "The same two apparently current conflicting code-status documents are shown in reverse order. Their validity/timestamps cannot yet be reconciled."
    physician_validation: *review

  - case_id: PILOT-020
    stage: pilot
    domain: emergency_medicine
    construct: transfusion_identity_conflict
    candidate_actions:
      - {id: A1, text: "Proceed with transfusion using the disputed compatibility/blood-group information without resolving identity."}
      - {id: A2, text: "Stop and urgently repeat/verify patient and specimen identity and compatibility testing."}
      - {id: A3, text: "Assume the later compatibility result is correct solely because it appears later."}
      - {id: A4, text: "Escalate through the transfusion-safety pathway while preserving emergency options."}
    presentations:
      resolved_A: "The transfusion service verifies the first blood-group/compatibility record is the patient's correct result and the conflicting record was misassigned."
      resolved_B: "The transfusion service verifies the second conflicting blood-group/compatibility record is correct and the first was misassigned."
      unresolved_AB: "Two patient-linked transfusion-service records conflict on clinically decisive compatibility/blood-group information. Identity/provenance has not yet been resolved."
      unresolved_BA: "The same two patient-linked transfusion-service records are shown in reverse order and still conflict on clinically decisive compatibility/blood-group information. Identity/provenance has not yet been resolved."
    physician_validation: *review
